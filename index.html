<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Inicio de Sesión</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f7;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      width: 340px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 20px rgba(0,0,0,0.15);
      background: white;
    }

    .banner {
      width: 100%;
      height: 95px; 
      /* Enlace optimizado para la Imagen 1 */
      background: url('https://lh3.googleusercontent.com/d/1-X8LmyU5f31rpFsOFTFdynRSMFN_3AyQ') no-repeat center;
      background-size: cover;
    }

    .login-box {
      padding: 20px;
      text-align: center;
    }

    input {
      width: 90%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button {
      width: 95%;
      padding: 12px;
      background: #0071e3;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="banner"></div>
    <div class="login-box">
      <h2>Iniciar sesión</h2>
      <p style="font-size: 12px; color: gray;">Inicia sesión para participar</p>
      <input type="email" placeholder="Correo electrónico">
      <input type="password" placeholder="Contraseña">
      <button onclick="window.location.href='ruleta.html'">Entrar</button>
    </div>
  </div>

</body>
</html>
